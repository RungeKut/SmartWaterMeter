[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    NTPClient
    me-no-dev/ESPAsyncTCP
    me-no-dev/ESPAsyncWebServer
    bblanchon/ArduinoJson
lib_ignore = Arduino_ESP32_OTA, GyverPortal, AsyncTCP_RP2040W, AsyncTCP_RP2040W@1.2.0, AsyncTCP
lib_extra_dirs = lib
board_build.f_cpu = 80000000L

; Два OTA-слота (A/B) для fail-safe обновления
; Каждый слот по 1MB, SPIFFS 1MB, EEPROM 4KB
board_upload.flash_size = 4MB
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m2m.ld

; Не стирать весь чип при upload по USB — сохраняем EEPROM и LittleFS
board_upload.erase_cmd =

; Для первой прошивки по USB нужно залить образ в оба слота
; После этого OTA будет писать в неактивный слот
; extra_scripts = pre:upload_script.py

; OTA-прошивка по WiFi
upload_protocol = espota
upload_port = 192.168.88.87
upload_flags =
    --host_ip=192.168.88.92
    --host_port=33777

; Файловая система LittleFS для SPA фронтенда
board_build.filesystem = littlefs