[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    NTPClient
    me-no-dev/ESPAsyncTCP
    me-no-dev/ESPAsyncWebServer
    bblanchon/ArduinoJson
    marvinroger/AsyncMqttClient
lib_ignore = Arduino_ESP32_OTA, GyverPortal, AsyncTCP_RP2040W, AsyncTCP_RP2040W@1.2.0, AsyncTCP
lib_extra_dirs = lib
board_build.f_cpu = 80000000L

; Разметка eagle.flash.4m2m.ld (4MB flash):
;   0x000000  прошивка   ~1MB
;   0x200000  LittleFS    2MB
;   0x3FB000  EEPROM      4KB
; A/B-слотов нет: OTA пишет образ во временную область,
; а загрузчик eboot при ребуте копирует его в 0x000000.
board_upload.flash_size = 4MB
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m2m.ld

; Не стирать весь чип при upload по USB — сохраняем EEPROM и LittleFS
board_upload.erase_cmd =

; OTA-прошивка по WiFi
upload_protocol = espota
upload_port = 192.168.88.87
upload_flags =
    --host_ip=192.168.88.92
    --host_port=33777

; Файловая система LittleFS для SPA фронтенда
board_build.filesystem = littlefs