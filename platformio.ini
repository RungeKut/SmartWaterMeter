[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = 
    gyverportal
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    ESP_Mail_Client
    NTPClient
lib_ignore = Arduino_ESP32_OTA
lib_extra_dirs = lib
board_build.f_cpu = 80000000L

; Два OTA-слота (A/B) для fail-safe обновления
; Каждый слот по 1MB, SPIFFS 1MB, EEPROM 4KB
board_upload.flash_size = 4MB
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m2m.ld

; Для первой прошивки по USB нужно залить образ в оба слота
; После этого OTA будет писать в неактивный слот
extra_scripts = pre:upload_script.py

; OTA-прошивка по WiFi
; Раскомментируйте и укажите IP вашего устройства для OTA:
; upload_protocol = espota
; upload_port = 192.168.88.89